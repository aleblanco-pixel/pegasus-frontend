name: Build Pegasus Windows x64

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Download source code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          host: windows
          target: desktop
          arch: win64_mingw81
          tools: 'tools_mingw,qt.tools.win64_mingw810'
          archives: 'qtbase qtdeclarative qtmultimedia qtsvg qtgamepad qttools'

      - name: Download and Install SDL2
        uses: libsdl-org/setup-sdl@v1
        with:
          version: '2.30.0'
          win32-arch: 'x64'

      - name: Configure Pegasus
        shell: pwsh
        run: |
          cmake -S . -B build -G "MinGW Makefiles" `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" `
            -DPEGASUS_USE_SDL2_GAMEPAD=ON `
            -DPEGASUS_USE_SDL2_POWER=OFF `
            -DPEGASUS_ENABLE_LTO=OFF

      - name: Compile Pegasus
        run: cmake --build build --parallel 2

      - name: Install Pegasus
        run: cmake --install build --prefix package

      - name: Deploy Qt libraries
        shell: pwsh
        run: |
          $exePath = "package/bin/pegasus-fe.exe"
          if (-not (Test-Path $exePath)) {
              $exePath = "package/pegasus-fe.exe"
          }
          if (-not (Test-Path $exePath)) {
              $exePath = (Get-ChildItem -Path package -Recurse -Filter "pegasus-fe.exe" | Select-Object -First 1).FullName
          }
          Write-Host "Usando ejecutable en: $exePath"
          windeployqt --release --qmldir src/frontend $exePath

      - name: Create portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path package/* -DestinationPath Pegasus-Windows-x64.zip

      - name: Upload Windows x64 build
        uses: actions/upload-artifact@v4
        with:
          name: Pegasus-Windows-x64
          path: Pegasus-Windows-x64.zip
